name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # Runs before the tests on purpose: a leak should fail here, not after a
      # suite that takes longer and hides the reason.
      - name: Scan for committed credentials
        run: python scripts/check_no_secrets.py

      - name: Check the app boots with no engine configured
        run: python -c "from fastapi.testclient import TestClient; import app; c=TestClient(app.app); r=c.get('/'); assert r.status_code==200, r.status_code; s=c.get('/api/system/engine-status').json(); print('provider:', s['provider'], 'reachable:', s['reachable'])"

      - name: Run the test suite
        run: python -m pytest -q

  docs-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shipped docs must not point at one machine
        run: |
          set -euo pipefail
          hits=$(grep -rniE 'localhost|192\.168\.[0-9]+\.[0-9]+|127\.0\.0\.1' \
                   --include='*.md' README.md docs/ || true)
          if [ -n "$hits" ]; then
            echo "Found a machine-specific address in the documentation:"
            echo "$hits"
            echo "Use <app-host> or <ollama-host> so the instructions work for whoever reads them."
            exit 1
          fi

      - name: No company name may be baked into the shipped copy
        run: |
          set -euo pipefail
          hits=$(grep -rnE '\{\{VENDOR_NAME\}\}' static/index.html >/dev/null && echo ok)
          [ "$hits" = "ok" ] || { echo "static/index.html lost its vendor placeholder"; exit 1; }
